[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "implied-stock-distributions"
version = "0.2.0"
description = "Risk-neutral and physical densities for the S&P 500, recovered from SPX option prices"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Steven Buchanan" }]
keywords = ["options", "risk-neutral density", "Breeden-Litzenberger", "CRPS"]

dependencies = [
    # np.trapezoid is NumPy 2.0; make_splrep is SciPy 1.15. Both are recent
    # enough that the project will not run without the pins.
    "numpy>=2.0",
    "scipy>=1.15",
    "pandas>=2.2",
    "pyarrow>=15",
    "cvxpy>=1.5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4.0", "ipython>=8.0", "lxml>=5.0", "html5lib>=1.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["implied_stock_distributions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
