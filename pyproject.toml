[project]
name = "implied-stock-distributions"
version = "0.3.0"
description = "Risk-neutral and physical densities for the S&P 500, recovered from SPX option prices."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Steven Buchanan" }]
keywords = ["options", "risk-neutral density", "Breeden-Litzenberger", "CRPS"]
dependencies = [
    # np.trapezoid needs NumPy 2.0 and make_splrep needs SciPy 1.15.
    "numpy>=2.0",
    "scipy>=1.15",
    "pandas>=2.2",
    "pyarrow>=15",
    "cvxpy>=1.5",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "nbconvert>=7.0",
    # pd.read_html in 01_processing.ipynb, for the Cboe settlement table.
    "lxml>=5.0",
]

[tool.uv]
default-groups = ["dev", "notebooks"]

[build-system]
requires = ["uv_build>=0.12.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "implied_stock_distributions"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Long print and f-string lines are normal in an analysis notebook.
"*.ipynb" = ["E501"]
